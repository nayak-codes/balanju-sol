<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <defs>
    <linearGradient id="softwareGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00C9A7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00997a;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="200" height="200" fill="url(#softwareGrad)" rx="40"/>
  
  <!-- Code/Gears -->
  <g transform="translate(35, 35)">
    <!-- Left gear -->
    <circle cx="30" cy="50" r="22" fill="none" stroke="white" stroke-width="3" opacity="0.9"/>
    <g transform="translate(30, 50)">
      <polygon points="0,-8 2,-2 8,-1 3,3 5,9 0,5 -5,9 -3,3 -8,-1 -2,-2" fill="white" opacity="0.7"/>
    </g>
    
    <!-- Right gear -->
    <circle cx="100" cy="50" r="20" fill="none" stroke="white" stroke-width="3" opacity="0.9"/>
    <g transform="translate(100, 50)">
      <polygon points="0,-7 2,-2 7,-1 3,2 4,8 0,4 -4,8 -3,2 -7,-1 -2,-2" fill="white" opacity="0.7"/>
    </g>
    
    <!-- Connection dots -->
    <circle cx="52" cy="50" r="3" fill="white" opacity="0.8"/>
    <circle cx="78" cy="50" r="3" fill="white" opacity="0.8"/>
  </g>
</svg>