<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <defs>
    <linearGradient id="aiGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF9F1C;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E67E00;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="200" height="200" fill="url(#aiGrad)" rx="40"/>
  
  <!-- Brain/AI circuit -->
  <g transform="translate(50, 40)">
    <!-- Central brain node -->
    <circle cx="50" cy="50" r="12" fill="white" opacity="0.9"/>
    <!-- Brain lines -->
    <circle cx="50" cy="50" r="8" fill="none" stroke="white" stroke-width="1.5" opacity="0.7"/>
    
    <!-- Connected nodes -->
    <circle cx="25" cy="30" r="7" fill="white" opacity="0.8"/>
    <circle cx="75" cy="30" r="7" fill="white" opacity="0.8"/>
    <circle cx="15" cy="55" r="7" fill="white" opacity="0.8"/>
    <circle cx="85" cy="55" r="7" fill="white" opacity="0.8"/>
    <circle cx="30" cy="80" r="7" fill="white" opacity="0.8"/>
    <circle cx="70" cy="80" r="7" fill="white" opacity="0.8"/>
    
    <!-- Connecting lines -->
    <line x1="50" y1="50" x2="25" y2="30" stroke="white" stroke-width="1.5" opacity="0.6"/>
    <line x1="50" y1="50" x2="75" y2="30" stroke="white" stroke-width="1.5" opacity="0.6"/>
    <line x1="50" y1="50" x2="15" y2="55" stroke="white" stroke-width="1.5" opacity="0.6"/>
    <line x1="50" y1="50" x2="85" y2="55" stroke="white" stroke-width="1.5" opacity="0.6"/>
    <line x1="50" y1="50" x2="30" y2="80" stroke="white" stroke-width="1.5" opacity="0.6"/>
    <line x1="50" y1="50" x2="70" y2="80" stroke="white" stroke-width="1.5" opacity="0.6"/>
  </g>
</svg>