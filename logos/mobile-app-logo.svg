<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <defs>
    <linearGradient id="mobileGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF4D6D;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E63546;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="200" height="200" fill="url(#mobileGrad)" rx="40"/>
  
  <!-- Phone -->
  <g transform="translate(50, 25)">
    <!-- Phone body -->
    <rect x="0" y="0" width="100" height="150" fill="white" rx="12" opacity="0.95"/>
    <!-- Notch -->
    <rect x="35" y="2" width="30" height="12" fill="#1F2937" rx="0"/>
    
    <!-- Screen content -->
    <rect x="5" y="20" width="90" height="8" fill="#FF4D6D" rx="2"/>
    <rect x="5" y="32" width="90" height="4" fill="#6B7280" rx="1"/>
    <rect x="5" y="40" width="90" height="4" fill="#6B7280" rx="1"/>
    
    <!-- App icons grid -->
    <rect x="8" y="52" width="16" height="16" fill="#6C3DE8" rx="3"/>
    <rect x="28" y="52" width="16" height="16" fill="#FF9F1C" rx="3"/>
    <rect x="48" y="52" width="16" height="16" fill="#00C9A7" rx="3"/>
    <rect x="68" y="52" width="16" height="16" fill="#FF4D6D" rx="3"/>
    
    <!-- Status bar icons -->
    <circle cx="85" cy="6" r="1.5" fill="#1F2937"/>
    <rect x="80" y="4" width="8" height="3" fill="#1F2937" opacity="0.6"/>
    
    <!-- Home indicator -->
    <rect x="40" y="145" width="20" height="2" fill="#1F2937" rx="1"/>
  </g>
</svg>