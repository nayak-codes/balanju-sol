<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <defs>
    <linearGradient id="uiGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6C3DE8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#9B35C8;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="200" height="200" fill="url(#uiGrad)" rx="40"/>
  
  <!-- Design palette -->
  <g transform="translate(40, 40)">
    <!-- Color palette circles -->
    <circle cx="20" cy="20" r="12" fill="white" opacity="0.9"/>
    <circle cx="50" cy="20" r="12" fill="white" opacity="0.9"/>
    <circle cx="80" cy="20" r="12" fill="white" opacity="0.9"/>
    
    <circle cx="20" cy="60" r="12" fill="white" opacity="0.9"/>
    <circle cx="50" cy="60" r="12" fill="white" opacity="0.9"/>
    <circle cx="80" cy="60" r="12" fill="white" opacity="0.9"/>
    
    <!-- Color indicators -->
    <circle cx="20" cy="20" r="8" fill="#FF4D6D"/>
    <circle cx="50" cy="20" r="8" fill="#FF9F1C"/>
    <circle cx="80" cy="20" r="8" fill="#00C9A7"/>
    
    <circle cx="20" cy="60" r="8" fill="#6C3DE8"/>
    <circle cx="50" cy="60" r="8" fill="#9B35C8"/>
    <circle cx="80" cy="60" r="8" fill="#34d399"/>
  </g>
</svg>