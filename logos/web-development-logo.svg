<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <defs>
    <linearGradient id="webGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6C3DE8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4F2BCC;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="200" height="200" fill="url(#webGrad)" rx="40"/>
  
  <!-- Browser window -->
  <g transform="translate(30, 35)">
    <!-- Browser frame -->
    <rect x="0" y="0" width="140" height="130" fill="white" rx="8" opacity="0.95"/>
    <!-- Address bar -->
    <rect x="5" y="8" width="130" height="20" fill="#E5E7EB" rx="4"/>
    <!-- URL text -->
    <circle cx="12" cy="18" r="2" fill="#9CA3AF"/>
    <rect x="17" y="16" width="35" height="4" fill="#9CA3AF" rx="2"/>
    
    <!-- Content lines -->
    <rect x="8" y="38" width="50" height="6" fill="#1F2937" rx="2" opacity="0.8"/>
    <rect x="8" y="50" width="124" height="4" fill="#6B7280" rx="2" opacity="0.6"/>
    <rect x="8" y="58" width="124" height="4" fill="#6B7280" rx="2" opacity="0.6"/>
    <rect x="8" y="66" width="100" height="4" fill="#6B7280" rx="2" opacity="0.6"/>
    
    <!-- Button -->
    <rect x="8" y="78" width="40" height="10" fill="#6C3DE8" rx="4"/>
    <circle cx="18" cy="83" r="1.5" fill="white"/>
    <circle cx="23" cy="83" r="1.5" fill="white"/>
  </g>
</svg>