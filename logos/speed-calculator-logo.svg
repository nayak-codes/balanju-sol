<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <defs>
    <linearGradient id="speedGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF6B35;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E63946;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="200" height="200" fill="url(#speedGrad)" rx="40"/>
  
  <!-- Speedometer -->
  <g transform="translate(40, 40)">
    <!-- Gauge circle -->
    <circle cx="60" cy="70" r="45" fill="none" stroke="white" stroke-width="2" opacity="0.9"/>
    
    <!-- Speed markings -->
    <g stroke="white" stroke-width="1.5" opacity="0.7">
      <line x1="60" y1="26" x2="60" y2="32"/>
      <line x1="91" y1="35" x2="87" y2="40"/>
      <line x1="102" y1="70" x2="96" y2="70"/>
      <line x1="91" y1="105" x2="87" y2="100"/>
      <line x1="60" y1="114" x2="60" y2="108"/>
    </g>
    
    <!-- Needle (moving) -->
    <g transform="translate(60, 70)">
      <line x1="0" y1="0" x2="25" y2="-15" stroke="white" stroke-width="3" stroke-linecap="round" opacity="0.9"/>
      <circle cx="0" cy="0" r="4" fill="white"/>
    </g>
    
    <!-- Speed numbers -->
    <text x="60" y="125" font-size="10" font-weight="bold" fill="white" text-anchor="middle" opacity="0.8">0-100</text>
  </g>
</svg>